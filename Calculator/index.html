<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcX Pro — Smart Calculator</title>
    <meta name="description" content="CalcX Pro — A sleek, modern calculator with history, keyboard support, dark/light themes, and professional glassmorphism UI. Built by Afaq Ul Islam.">
    <meta name="keywords" content="calculator, calcx, pro calculator, online calculator, glassmorphism calculator, dark mode calculator">
    <meta name="author" content="Afaq Ul Islam">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#8b5cf6">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="calc-wrapper">
        <div class="calculator">
            <div class="calc-header">
                <div class="header-left">
                    <span class="brand-dot"></span>
                    <span class="brand-name">CalcX</span>
                    <span class="brand-pro">PRO</span>
                </div>
                <div class="header-right">
                    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle Theme">
                        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                    <button class="history-toggle-btn" id="historyToggle" onclick="toggleHistory()" title="History">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                    </button>
                </div>
            </div>

            <div class="display-box">
                <div class="display-expression" id="expression"></div>
                <div class="display-result" id="display">0</div>
            </div>

            <div class="buttons-grid">
                <button class="btn btn-function" onclick="clearAll()"><span>AC</span></button>
                <button class="btn btn-function" onclick="toggleSign()"><span>+/-</span></button>
                <button class="btn btn-function" onclick="percentage()"><span>%</span></button>
                <button class="btn btn-operator" onclick="appendChar('/')"><span>÷</span></button>

                <button class="btn btn-number" onclick="appendChar('7')"><span>7</span></button>
                <button class="btn btn-number" onclick="appendChar('8')"><span>8</span></button>
                <button class="btn btn-number" onclick="appendChar('9')"><span>9</span></button>
                <button class="btn btn-operator" onclick="appendChar('*')"><span>x</span></button>

                <button class="btn btn-number" onclick="appendChar('4')"><span>4</span></button>
                <button class="btn btn-number" onclick="appendChar('5')"><span>5</span></button>
                <button class="btn btn-number" onclick="appendChar('6')"><span>6</span></button>
                <button class="btn btn-operator" onclick="appendChar('-')"><span>-</span></button>

                <button class="btn btn-number" onclick="appendChar('1')"><span>1</span></button>
                <button class="btn btn-number" onclick="appendChar('2')"><span>2</span></button>
                <button class="btn btn-number" onclick="appendChar('3')"><span>3</span></button>
                <button class="btn btn-operator" onclick="appendChar('+')"><span>+</span></button>

                <button class="btn btn-number btn-zero" onclick="appendChar('0')"><span>0</span></button>
                <button class="btn btn-number" onclick="appendChar('.')"><span>.</span></button>
                <button class="btn btn-equals" onclick="calculate()"><span>=</span></button>
            </div>

            <div class="calc-footer">
                <span>Keyboard Ready</span>
                <span class="footer-dot"></span>
                <span>AFAQ UL ISLAM</span>
            </div>
        </div>

        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <h3>History</h3>
                <button class="history-clear-btn" onclick="clearHistory()">Clear All</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">
                    <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                    <p>No calculations yet</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
