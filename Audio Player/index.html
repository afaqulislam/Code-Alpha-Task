<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta -->
    <title>SonicWave - Modern Audio Player</title>
    <meta name="description" content="SonicWave is a sleek, modern web-based audio player featuring glassmorphism UI, animated visualizer, playlist management, volume control, and keyboard shortcuts. Built with vanilla HTML, CSS, and JavaScript.">
    <meta name="keywords" content="audio player, music player, web player, vanilla JS, glassmorphism, sonicwave, frontend project">
    <meta name="author" content="Afaq Ul Islam">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="color-scheme" content="dark">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SonicWave - Modern Audio Player">
    <meta property="og:description" content="A sleek, modern web-based audio player with glassmorphism UI, animated visualizer, and full playback controls.">
    <meta property="og:site_name" content="SonicWave">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="SonicWave - Modern Audio Player">
    <meta name="twitter:description" content="A sleek, modern web-based audio player with glassmorphism UI, animated visualizer, and full playback controls.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a1a'/%3E%3Cpath d='M42 14v24.5c0 0-1-4.5-6-4.5s-7 3.5-7 7 3.5 7 7 7 6-3 6-3V26l-16 3.5v18c0 0-1-4.5-6-4.5s-7 3.5-7 7 3.5 7 7 7 6-3 6-3V17.5L42 14z' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a1a'/%3E%3Cpath d='M42 14v24.5c0 0-1-4.5-6-4.5s-7 3.5-7 7 3.5 7 7 7 6-3 6-3V26l-16 3.5v18c0 0-1-4.5-6-4.5s-7 3.5-7 7 3.5 7 7 7 6-3 6-3V17.5L42 14z' fill='url(%23g)'/%3E%3C/svg%3E">

    <!-- Fonts & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="player-wrapper">
        <div class="player-card">

            <div class="visualizer">
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
                <div class="viz-bar"></div><div class="viz-bar"></div>
            </div>

            <div class="album-container">
                <div class="album-ring"></div>
                <div class="album-art">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                </div>
            </div>

            <div class="song-info">
                <h1 class="song-title" id="songTitle">Select a Track</h1>
                <p class="song-artist" id="songArtist">Browse the playlist below</p>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-thumb" id="progressThumb"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>

            <div class="main-controls">
                <button class="ctrl-btn" id="shuffleBtn" title="Shuffle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"/>
                        <line x1="4" y1="20" x2="21" y2="3"/>
                        <polyline points="21 16 21 21 16 21"/>
                        <line x1="15" y1="15" x2="21" y2="21"/>
                        <line x1="4" y1="4" x2="9" y2="9"/>
                    </svg>
                </button>
                <button class="ctrl-btn" id="prevBtn" title="Previous">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="ctrl-btn play-btn" id="playBtn" title="Play">
                    <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg viewBox="0 0 24 24" fill="currentColor" id="pauseIcon" class="hidden">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <button class="ctrl-btn" id="nextBtn" title="Next">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
                <button class="ctrl-btn" id="repeatBtn" title="Repeat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"/>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                        <polyline points="7 23 3 19 7 15"/>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </svg>
                </button>
            </div>

            <div class="volume-container">
                <button class="vol-btn" id="volumeBtn" title="Mute">
                    <svg viewBox="0 0 24 24" fill="currentColor" id="volumeIcon">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                    <svg viewBox="0 0 24 24" fill="currentColor" id="muteIcon" class="hidden">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                </button>
                <div class="volume-slider-container" id="volumeSliderContainer">
                    <div class="volume-bar" id="volumeBar"></div>
                    <div class="volume-thumb" id="volumeThumb"></div>
                </div>
            </div>

            <div class="playlist">
                <h3 class="playlist-label">Playlist</h3>
                <div class="playlist-items" id="playlistItems">
                    <div class="playlist-item active" data-index="0">
                        <div class="playlist-item-number">01</div>
                        <div class="playlist-item-info">
                            <span class="playlist-item-title">Midnight Dreams</span>
                            <span class="playlist-item-artist">Luna Echo</span>
                        </div>
                        <div class="playlist-item-duration" id="duration0">--:--</div>
                    </div>
                    <div class="playlist-item" data-index="1">
                        <div class="playlist-item-number">02</div>
                        <div class="playlist-item-info">
                            <span class="playlist-item-title">Neon Horizons</span>
                            <span class="playlist-item-artist">Synth Wave</span>
                        </div>
                        <div class="playlist-item-duration" id="duration1">--:--</div>
                    </div>
                    <div class="playlist-item" data-index="2">
                        <div class="playlist-item-number">03</div>
                        <div class="playlist-item-info">
                            <span class="playlist-item-title">Electric Pulse</span>
                            <span class="playlist-item-artist">Bass Theory</span>
                        </div>
                        <div class="playlist-item-duration" id="duration2">--:--</div>
                    </div>
                </div>
            </div>

            <div class="player-footer">
                <span>SonicWave</span>
                <span class="dot"></span>
                <span>Developed by Afaq Ul Islam</span>
            </div>
        </div>
    </div>

    <audio id="player-audio" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
